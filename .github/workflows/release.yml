name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish extension ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          MANIFEST_VERSION=$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' manifest.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match manifest.json version $MANIFEST_VERSION" >&2
            exit 1
          fi

      - name: Build ZIP
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            "dist/toll-v${VERSION}.zip"
