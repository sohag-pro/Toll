<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { width: 260px; margin: 0; padding: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #12141a; color: #e8ebf0; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  h2 { font-size: 12px; margin: 12px 0 4px; color: #cfd4de; }
  p { font-size: 12px; color: #9aa3b2; margin: 0 0 8px; line-height: 1.4; }

</style>
</head>
<body>
  <h1>FreeYou is armed</h1>
  <p>Solve 3 math problems to break each doom-scroll trigger.</p>

  <h2>Reel mode (blocks scroll)</h2>
  <ul>
    <li>YouTube Shorts</li>
    <li>Facebook Reels</li>
    <li>Instagram Reels</li>
    <li>TikTok</li>
  </ul>

  <h2>Feed cap (paginates infinite scroll)</h2>
  <ul>
    <li>YouTube homepage &amp; feed</li>
    <li>Facebook home / news feed</li>
  </ul>

</html>
