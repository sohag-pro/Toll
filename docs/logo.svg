<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Toll logo">
  <title>Toll</title>
  <defs>
    <linearGradient id="fy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12141a"/>
      <stop offset="1" stop-color="#1b2030"/>
    </linearGradient>
    <linearGradient id="fy-loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#fy-bg)"/>
  <!-- Broken infinity: two loops separated by a math + badge in the middle -->
  <circle cx="40" cy="64" r="22" fill="none" stroke="url(#fy-loop)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="88" cy="64" r="22" fill="none" stroke="url(#fy-loop)" stroke-width="9" stroke-linecap="round"/>
  <!-- Center mask so the loops read as broken -->
  <circle cx="64" cy="64" r="17" fill="#12141a"/>
  <circle cx="64" cy="64" r="15" fill="none" stroke="url(#fy-loop)" stroke-width="2" opacity="0.35"/>
  <!-- Plus glyph inside the badge -->
  <path d="M64 54 L64 74 M54 64 L74 64" stroke="#e8ebf0" stroke-width="5.5" stroke-linecap="round"/>
</svg>
